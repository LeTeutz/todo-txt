<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
     role="img" aria-label="todo.txt — a plain-text todo file with one line mid AI edit, staged for review">
  <title>todo.txt — plain-text todos with staged, reviewable AI edits</title>
  <defs>
    <radialGradient id="halo" cx="34%" cy="52%" r="58%">
      <stop offset="0%" stop-color="#047558" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#047558" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-200%" width="220%" height="500%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
  <rect x="0" y="0" width="1280" height="720" fill="url(#halo)"/>

  <!-- focal row: the line being edited -->
  <rect x="124" y="346" width="1012" height="40" rx="12" fill="#047558" opacity="0.10" filter="url(#soft)"/>
  <rect x="124" y="346" width="1012" height="40" rx="12" fill="#047558" fill-opacity="0.07"/>
  <rect x="124" y="346" width="3" height="40" rx="1.5" fill="#047558"/>

  <!-- gutter rule -->
  <line x1="124" y1="150" x2="124" y2="628" stroke="#d0d7de" stroke-width="1.5"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" xml:space="preserve">

    <!-- line numbers -->
    <g font-size="15" fill="#656d76" opacity="0.6" text-anchor="end">
      <text x="104" y="200">1</text>
      <text x="104" y="256">2</text>
      <text x="104" y="312">3</text>
      <text x="104" y="368">4</text>
      <text x="104" y="424">5</text>
      <text x="104" y="480">6</text>
      <text x="104" y="536">7</text>
      <text x="104" y="592">8</text>
    </g>

    <!-- task lines -->
    <g font-size="21">
      <text x="152" y="200" fill="#656d76" opacity="0.75">x 2026-08-03 Wire filter chips +ui @app</text>

      <text x="152" y="256" fill="#1f2328"><tspan fill="#cf222e">(A) </tspan>Fix due: legibility <tspan fill="#0969da">+ui </tspan><tspan fill="#1b7c83">@polish </tspan><tspan fill="#9a6700">due:2026-08-06</tspan></text>

      <text x="152" y="312" fill="#1f2328"><tspan fill="#953800">(B) </tspan>Bundle lucide icons <tspan fill="#0969da">+build </tspan><tspan fill="#1b7c83">@deps</tspan></text>

      <text x="152" y="368" fill="#1f2328"><tspan fill="#cf222e">(A) </tspan>Write hero art <tspan fill="#0969da">+launch </tspan><tspan fill="#1b7c83">@brand </tspan><tspan fill="#9a6700">due:2026-08-12</tspan></text>

      <text x="152" y="424" fill="#1f2328"><tspan fill="#656d76">(C) </tspan>Weekly review of done.txt <tspan fill="#0969da">+habit </tspan><tspan fill="#1b7c83">@home </tspan><tspan fill="#8250df">rec:1w</tspan></text>

      <text x="152" y="480" fill="#1f2328">Draft release notes <tspan fill="#0969da">+launch </tspan><tspan fill="#1b7c83">@docs </tspan><tspan fill="#8250df">t:2026-08-10</tspan></text>

      <text x="152" y="536" fill="#1f2328"><tspan fill="#953800">(B) </tspan>Add e2e for vim mode <tspan fill="#0969da">+test </tspan><tspan fill="#1b7c83">@app</tspan></text>

      <text x="152" y="592" fill="#656d76" opacity="0.75">x 2026-07-29 Move data root to app dir +infra @app</text>
    </g>

    <!-- completed lines struck through -->
    <g fill="#656d76" opacity="0.5">
      <rect x="152" y="193" width="491" height="1.6"/>
      <rect x="152" y="585" width="617" height="1.6"/>
    </g>

    <!-- caret + staged AI-edit comment chip on the focal line -->
    <rect x="766" y="350" width="11" height="25" rx="2" fill="#047558" opacity="0.85"/>
    <line x1="781" y1="366" x2="796" y2="366" stroke="#047558" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="3 3"/>
    <rect x="796" y="346" width="316" height="40" rx="12" fill="#047558" opacity="0.16" filter="url(#soft)"/>
    <rect x="796" y="346" width="316" height="40" rx="12" fill="#047558" fill-opacity="0.09"
          stroke="#047558" stroke-opacity="0.55" stroke-width="1.25" stroke-dasharray="5 4"/>
    <text x="814" y="372" font-size="16" fill="#047558"># split this into 3 subtasks ▸</text>

    <!-- wordmark -->
    <text x="116" y="76" font-size="28" fill="#1f2328">todo.txt</text>
    <text x="116" y="99" font-size="14" fill="#656d76">plain-text todos · AI edits staged for review</text>
  </g>

  <!-- mark: check + caret, echoing icon.svg -->
  <g transform="translate(64,48) scale(1.45)" fill="none" stroke="#047558"
     stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 13.2 L8.2 18.4 L20 5.4"/>
    <rect x="15.2" y="17.2" width="5.8" height="3" rx="1.1" fill="#047558" stroke="none"/>
  </g>
</svg>
